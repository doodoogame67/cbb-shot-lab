name: Refresh data and deploy

on:
  schedule:
    # 13:00 UTC daily, Nov-Apr. sportsdataverse publishes its daily update around 07:00 UTC.
    - cron: "0 13 * 11,12,1,2,3,4 *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The game-level data is ~225 MB, so it is built here and deployed, never committed.
      - name: Build player data (2008 to current season)
        run: bash tools/refresh.sh

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
