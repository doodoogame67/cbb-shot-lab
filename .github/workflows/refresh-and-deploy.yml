name: Refresh data and deploy

on:
  schedule:
    # 13:00 UTC daily, Nov-Apr. sportsdataverse publishes its daily update around 07:00 UTC.
    - cron: "0 13 * 11,12,1,2,3,4 *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rebuild player data
        run: bash tools/refresh.sh

      - name: Commit the CSV if it changed
        run: |
          if ! git diff --quiet -- site/data/players.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add site/data/players.csv
            git commit -m "Data refresh $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
